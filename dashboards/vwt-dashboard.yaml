      primary: '{% set v = states(''sensor.vwt_avg_consumption'')|float(0) %}{% if v > 0 %}{{ ''%.1f'' | format(v) }} kWh/100km{% else %}–{% endif %}'
      secondary: Ø consumption
      tap_action:
        action: none
      grid_options:
        columns: 6
        rows: 1
      card_mod:
        style: |-
          ha-card {
            border-radius: 16px;
            border: 1px solid rgba(128,128,128,0.2);
            box-shadow: none;
          }
    - type: custom:mushroom-template-card
      icon: mdi:ev-station
      color: green
      icon_color: green
      primary: '{{ ''{:,.0f}''.format(states(''sensor.vwt_charged_total'')|float(0)) }} kWh'
      secondary: Charged · {{ states('counter.vwt_charge_count') }} sessions
      tap_action:
        action: none
      grid_options:
        columns: 6
        rows: 1
      card_mod:
        style: |-
          ha-card {
            border-radius: 16px;
            border: 1px solid rgba(128,128,128,0.2);
            box-shadow: none;
          }
    - type: custom:mushroom-template-card
      icon: mdi:cash
      color: green
      icon_color: green
      primary: '{{ ''%.2f'' | format(states(''sensor.vwt_charge_cost_total'')|float(0)) }} €'
      secondary: Charging cost · Ø {{ '%.2f' | format(states('sensor.vwt_avg_price')|float(0)) }} €/kWh
      tap_action:
        action: none
      grid_options:
        columns: 6
        rows: 1
      card_mod:
        style: |-
          ha-card {
            border-radius: 16px;
            border: 1px solid rgba(128,128,128,0.2);
            box-shadow: none;
          }
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Monthly history
      icon: mdi:chart-bar
      heading_style: title
    - type: grid
      columns: 2
      square: false
      cards:
      - type: statistics-graph
        title: Driven km per month
        chart_type: bar
        period: month
        days_to_show: 365
        stat_types:
        - change
        hide_legend: true
        entities:
        - entity: sensor.vwt_odometer
          name: Driven
          color: '#00B0F0'
        card_mod:
          style: |-
            ha-card {
              border-radius: 16px;
              border: 1px solid rgba(128,128,128,0.2);
              box-shadow: none;
            }
      - type: statistics-graph
        title: Charged kWh per month
        chart_type: bar
        period: month
        days_to_show: 365
        stat_types:
        - change
        hide_legend: true
        entities:
        - entity: sensor.vwt_charged_total
          name: Charged
          color: '#2E9E5B'
        card_mod:
          style: |-
            ha-card {
              border-radius: 16px;
              border: 1px solid rgba(128,128,128,0.2);
              box-shadow: none;
            }
      grid_options:
        columns: full
      visibility:
      - condition: screen
        media_query: '(min-width: 768px)'
    - type: statistics-graph
      title: Driven km per month
      chart_type: bar
      period: month
      days_to_show: 365
      stat_types:
      - change
      hide_legend: true
      entities:
      - entity: sensor.vwt_odometer
        name: Driven
        color: '#00B0F0'
      grid_options:
        columns: full
        rows: auto
      card_mod:
        style: |-
          ha-card {
            border-radius: 16px;
            border: 1px solid rgba(128,128,128,0.2);
            box-shadow: none;
          }
      visibility:
      - condition: screen
        media_query: '(max-width: 767px)'
    - type: statistics-graph
      title: Charged kWh per month
      chart_type: bar
      period: month
      days_to_show: 365
      stat_types:
      - change
      hide_legend: true
      entities:
      - entity: sensor.vwt_charged_total
        name: Charged
        color: '#2E9E5B'
      grid_options:
        columns: full
        rows: auto
      card_mod:
        style: |-
          ha-card {
            border-radius: 16px;
            border: 1px solid rgba(128,128,128,0.2);
            box-shadow: none;
          }
      visibility:
      - condition: screen
        media_query: '(max-width: 767px)'
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Consumption
      icon: mdi:gauge
      heading_style: title
    - type: custom:mushroom-template-card
      icon: mdi:information-outline
      color: grey
      icon_color: grey
      primary: No consumption data yet
      secondary: Appears after the first trip recorded automatically or manually
      tap_action:
        action: none
      grid_options:
        columns: full
        rows: 1
      card_mod:
        style: |-
          ha-card {
            border-radius: 16px;
            border: 1px solid rgba(128,128,128,0.2);
            box-shadow: none;
          }
      visibility:
      - condition: numeric_state
        entity: sensor.vwt_consumption_last_trip
        below: 0.1
    - type: grid
      columns: 2
      square: false
      cards:
      - type: custom:plotly-graph
        title: Consumption per trip · 90 days
        hours_to_show: 2160
        refresh_interval: auto
        entities:
        - entity: sensor.vwt_consumption_last_trip
          name: Consumption
          mode: markers
          marker:
            size: 9
            color: '#00B0F0'
          filters:
          - filter: i>0
        layout:
          height: 260
          showlegend: false
          yaxis:
            title: kWh/100km
            rangemode: tozero
          paper_bgcolor: rgba(0,0,0,0)
          plot_bgcolor: rgba(0,0,0,0)
        card_mod:
          style: |-
            ha-card {
              border-radius: 16px;
              border: 1px solid rgba(128,128,128,0.2);
              box-shadow: none;
            }
      - type: statistics-graph
        title: Ø consumption per month
        chart_type: line
        period: month
        days_to_show: 365
        stat_types:
        - mean
        hide_legend: true
        entities:
        - entity: sensor.vwt_avg_consumption
          name: Ø consumption
          color: '#00B0F0'
        card_mod:
          style: |-
            ha-card {
              border-radius: 16px;
              border: 1px solid rgba(128,128,128,0.2);
              box-shadow: none;
            }
      grid_options:
        columns: full
      visibility:
      - condition: screen
        media_query: '(min-width: 768px)'
      - condition: numeric_state
        entity: sensor.vwt_consumption_last_trip
        above: 0
    - type: custom:plotly-graph
      title: Consumption per trip · 90 days
      hours_to_show: 2160
      refresh_interval: auto
      entities:
      - entity: sensor.vwt_consumption_last_trip
        name: Consumption
        mode: markers
        marker:
          size: 9
          color: '#00B0F0'
        filters:
        - filter: i>0
      layout:
        height: 260
        showlegend: false
        yaxis:
          title: kWh/100km
          rangemode: tozero
        paper_bgcolor: rgba(0,0,0,0)
        plot_bgcolor: rgba(0,0,0,0)
      card_mod:
        style: |-
          ha-card {
            border-radius: 16px;
            border: 1px solid rgba(128,128,128,0.2);
            box-shadow: none;
          }
      grid_options:
        columns: full
        rows: auto
      visibility:
      - condition: screen
        media_query: '(max-width: 767px)'
      - condition: numeric_state
        entity: sensor.vwt_consumption_last_trip
        above: 0
    - type: statistics-graph
      title: Ø consumption per month
      chart_type: line
      period: month
      days_to_show: 365
      stat_types:
      - mean
      hide_legend: true
      entities:
      - entity: sensor.vwt_avg_consumption
        name: Ø consumption
        color: '#00B0F0'
      card_mod:
        style: |-
          ha-card {
            border-radius: 16px;
            border: 1px solid rgba(128,128,128,0.2);
            box-shadow: none;
          }
      grid_options:
        columns: full
        rows: auto
      visibility:
      - condition: screen
        media_query: '(max-width: 767px)'
      - condition: numeric_state
        entity: sensor.vwt_consumption_last_trip
        above: 0
- title: Logs
  path: logs
  icon: mdi:book-open-variant
  type: sections
  max_columns: 2
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Logs
