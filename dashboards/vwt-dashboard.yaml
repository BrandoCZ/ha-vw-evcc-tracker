      secondary: '{% set v = state_attr(''sensor.vwt_charged_month'', ''last_period'') | float(0) %}Charged · {% if v > 0 %}Last month {{ ''{:,.0f}''.format(v) }} kWh{% else %}Last month –{% endif %}'
      tap_action:
        action: none
      grid_options:
        columns: 6
        rows: 1
      card_mod:
        style: |-
          ha-card {
            border-radius: 16px;
            border: 1px solid rgba(128,128,128,0.2);
            box-shadow: none;
          }
    - type: custom:mushroom-template-card
      icon: mdi:cash
      color: green
      icon_color: green
      primary: '{{ ''%.2f'' | format(states(''sensor.vwt_charge_cost_month'')|float(0)) }} €'
      secondary: Charging cost · Ø {{ '%.2f' | format(states('sensor.vwt_avg_price_month')|float(0)) }} €/kWh
      tap_action:
        action: none
      grid_options:
        columns: 6
