          }
    - type: custom:mushroom-template-card
      icon: mdi:cash
      color: green
      icon_color: green
      primary: '{{ ''%.2f'' | format(states(''sensor.vwt_charge_cost_year'')|float(0)) }} €'
      secondary: Charging cost
      tap_action:
        action: none
      grid_options:
        columns: 6
        rows: 1
      card_mod:
        style: |-
          ha-card {
            border-radius: 16px;
            border: 1px solid rgba(128,128,128,0.2);
            box-shadow: none;
          }
  - type: grid
    cards:
    - type: heading
      heading: Total
      icon: mdi:sigma
      heading_style: title
    - type: custom:mushroom-template-card
      icon: mdi:counter
      color: blue
      icon_color: blue
      primary: '{{ ''{:,.0f}''.format(states(''sensor.vwt_odometer'')|float(0)) }} km'
      secondary: Odometer
      tap_action:
        action: none
      grid_options:
        columns: 6
