      card_mod:
        style: |-
          ha-card {
            border-radius: 16px;
            border: 1px solid rgba(128,128,128,0.2);
            box-shadow: none;
          }
    - type: custom:mushroom-template-card
      icon: mdi:ev-station
      color: green
      icon_color: green
      primary: '{{ ''{:,.0f}''.format(states(''sensor.vwt_charged_year'')|float(0)) }} kWh'
      secondary: '{% set v = state_attr(''sensor.vwt_charged_year'', ''last_period'') | float(0) %}Charged · {% if v > 0 %}Last year {{ ''{:,.0f}''.format(v) }} kWh{% else %}Last year –{% endif %}'
      tap_action:
        action: none
      grid_options:
        columns: 6
