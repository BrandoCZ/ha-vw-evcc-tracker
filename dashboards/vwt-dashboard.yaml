# ha-vw-evcc-tracker – dashboard
#
# Install: Settings -> Dashboards -> Add dashboard -> (URL: vwt-dashboard) -> open it ->
# three dots -> "Edit dashboard" -> three dots -> "Raw configuration editor" -> paste this file.
# Requires the HACS cards: Mushroom, card-mod, ApexCharts card, Plotly graph card.
# Requires the sensors/helpers from packages/vwt_helpers.yaml (sensor.vwt_*).
#
views:
- title: Now
  path: now
  icon: mdi:car-electric
  type: sections
  max_columns: 2
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: EV
      icon: mdi:car-electric
      heading_style: title
      badges:
      - type: button
        text: Charging
        icon: mdi:ev-station
        color: green
        tap_action:
          action: more-info
          entity: script.vwt_record_charge
      - type: button
        text: Trip
        icon: mdi:routes
        color: blue
        tap_action:
          action: more-info
          entity: script.vwt_record_trip
      - type: entity
        entity: input_number.vwt_battery_net_kwh
        show_state: true
        show_icon: true
        icon: mdi:car-battery
        color: grey
        tap_action:
          action: more-info
  - type: grid
    cards:
    - type: heading
      heading: Vehicle
      icon: mdi:car-electric
      heading_style: title
      badges:
      - type: entity
        entity: sensor.vwt_last_update
        show_state: true
        show_icon: true
        icon: mdi:clock-outline
        color: grey
        tap_action:
          action: none
    - type: custom:apexcharts-card
      chart_type: radialBar
      header:
        show: false
      series:
      - entity: sensor.vwt_soc
        name: Battery
        color: '#00B0F0'
      apex_config:
        chart:
          height: 288
        plotOptions:
          radialBar:
            startAngle: -135
            endAngle: 135
            hollow:
              size: 68%
            track:
              background: rgba(128,128,128,0.2)
              strokeWidth: 100%
            dataLabels:
              name:
                show: true
                offsetY: 30
                fontSize: 14px
                color: '#8b95a5'
              value:
                show: true
                offsetY: -10
                fontSize: 46px
                fontWeight: 600
                color: '#888888'
        fill:
          type: gradient
          gradient:
            shade: dark
            type: horizontal
            gradientToColors:
            - '#00E5A0'
            stops:
            - 0
            - 100
        stroke:
          lineCap: round
        legend:
          show: false
      grid_options:
        columns: 12
      card_mod:
        style: |-
          ha-card {
            border-radius: 16px;
            border: 1px solid rgba(128,128,128,0.2);
            box-shadow: none;
          }
          .apexcharts-datalabel-value {
            fill: var(--primary-text-color) !important;
          }
          .apexcharts-datalabel-label {
            fill: var(--secondary-text-color) !important;
          }
    - type: custom:mushroom-chips-card
      alignment: center
      chips:
      - type: template
        icon: mdi:map-marker-distance
        icon_color: blue
        content: '{{ states(''sensor.vwt_range'') }} km'
      - type: template
        icon: mdi:lightning-bolt
        icon_color: green
        content: '{{ ((states(''sensor.vwt_soc'')|float(0)) * (states(''input_number.vwt_battery_net_kwh'')|float(86)) / 100) | round(1) | string }} kWh'
      - type: template
        icon: mdi:counter
        icon_color: grey
        content: '{{ ''{:,.0f}''.format(states(''sensor.vwt_odometer'')|float(0)) }} km'
  - type: grid
    cards:
    - type: heading
      heading: Last 30 days
      icon: mdi:calendar-range
      heading_style: title
    - type: custom:mushroom-template-card
      icon: mdi:road-variant
      color: blue
      icon_color: blue
      primary: '{{ ''{:,.0f}''.format(states(''input_number.vwt_km_30d'')|float(0)) }} km'
      secondary: Driven
      tap_action:
        action: none
      grid_options:
        columns: 6
        rows: 1
      card_mod:
        style: |-
          ha-card {
            border-radius: 16px;
            border: 1px solid rgba(128,128,128,0.2);
            box-shadow: none;
          }
    - type: custom:mushroom-template-card
      icon: mdi:gauge
      color: blue
      icon_color: blue
      primary: '{% set e = states(''input_number.vwt_drive_energy_30d'')|float(0) %}{% set km = states(''input_number.vwt_trip_km_30d'')|float(0) %}{% if km > 0 and e > 0 %}{{ ''%.1f'' | format(e / km * 100) }} kWh/100km{% else %}–{% endif %}'
      secondary: Ø consumption
      tap_action:
        action: none
      grid_options:
        columns: 6
        rows: 1
      card_mod:
        style: |-
          ha-card {
            border-radius: 16px;
            border: 1px solid rgba(128,128,128,0.2);
            box-shadow: none;
          }
    - type: custom:mushroom-template-card
      icon: mdi:ev-station
      color: green
      icon_color: green
      primary: '{{ ''%.1f'' | format(states(''input_number.vwt_charged_30d'')|float(0)) }} kWh'
      secondary: Charged
      tap_action:
        action: none
      grid_options:
        columns: 6
        rows: 1
      card_mod:
        style: |-
          ha-card {
            border-radius: 16px;
            border: 1px solid rgba(128,128,128,0.2);
            box-shadow: none;
          }
    - type: custom:mushroom-template-card
      icon: mdi:calendar-today
      color: blue
      icon_color: blue
      primary: '{{ ''{:,.0f}''.format(states(''input_number.vwt_km_30d'')|float(0) / 30) }} km'
      secondary: Ø per day
      tap_action:
        action: none
      grid_options:
        columns: 6
        rows: 1
      card_mod:
        style: |-
          ha-card {
            border-radius: 16px;
            border: 1px solid rgba(128,128,128,0.2);
            box-shadow: none;
          }
    - type: heading
      heading: Recent
      icon: mdi:history
      heading_style: title
    - type: custom:mushroom-template-card
      icon: mdi:map-marker-path
      color: blue
      icon_color: blue
      primary: '{% set km = states(''input_number.vwt_last_trip_km'')|float(0) %}{% set v = states(''sensor.vwt_consumption_last_trip'')|float(0) %}{% if km > 0 %}{{ ''%.1f'' | format(km) }} km{% if v > 0 %} · {{ ''%.1f'' | format(v) }} kWh/100km{% endif %}{% else %}No trip yet{% endif %}'
      secondary: Last trip
      tap_action:
        action: navigate
        navigation_path: /vwt-dashboard/logs
      grid_options:
        columns: 12
        rows: 1
      card_mod:
        style: |-
          ha-card {
            border-radius: 16px;
            border: 1px solid rgba(128,128,128,0.2);
            box-shadow: none;
          }
    - type: custom:mushroom-template-card
      icon: mdi:ev-station
      color: green
      icon_color: green
      primary: '{{ states(''input_text.vwt_last_charge'') }}'
      secondary: Last charging session
      tap_action:
        action: navigate
        navigation_path: /vwt-dashboard/logs
      grid_options:
        columns: 12
        rows: 1
      card_mod:
        style: |-
          ha-card {
            border-radius: 16px;
            border: 1px solid rgba(128,128,128,0.2);
            box-shadow: none;
          }
